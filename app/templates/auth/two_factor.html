{% extends "auth/_auth_shell.html" %}

{% block title %}{{ _('Two-factor authentication') }} - {{ app_name }}{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold tracking-tight">{{ _('Enter authentication code') }}</h2>
<p class="mt-2 text-sm text-text-muted-light dark:text-text-muted-dark">
    {{ _('Open your authenticator app and enter the 6-digit code.') }}
</p>

<form class="mt-6" method="POST" action="{{ url_for('auth.two_factor') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="code" class="block mb-2 text-sm font-medium">{{ _('Code') }}</label>
    <input type="text" name="code" id="code" inputmode="numeric" autocomplete="one-time-code"
           class="w-full bg-background-light dark:bg-gray-700 border border-border-light dark:border-border-dark rounded-lg px-3 py-2.5 text-base text-text-light dark:text-text-dark placeholder-text-muted-light dark:placeholder-text-muted-dark focus:outline-none focus:ring-2 focus:ring-primary"
           placeholder="123 456" required>

    <button type="submit" class="btn btn-primary w-full mt-6">{{ _('Verify') }}</button>

    <div class="mt-4 text-center">
        <a href="{{ url_for('auth.login') }}" class="text-sm text-primary hover:underline">{{ _('Back to sign in') }}</a>
    </div>
</form>
{% endblock %}
