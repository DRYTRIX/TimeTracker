<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimeTracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>TimeTracker</h1>
        <div class="row" style="flex: 0; gap: 10px">
          <a href="options.html" id="open-options" target="_blank">Settings</a>
        </div>
      </div>

      <div id="message" class="hidden" role="status"></div>

      <div id="need-setup" class="card hidden">
        <p class="muted" style="margin: 0 0 10px">
          Connect to your TimeTracker server to start and stop timers from the toolbar.
        </p>
        <button type="button" class="btn btn-primary btn-block" id="go-settings">Open settings</button>
      </div>

      <div id="running-view" class="card hidden">
        <div class="timer-display">
          <div class="elapsed" id="elapsed">00h:00m</div>
          <div id="paused-badge" class="paused-badge hidden">Paused</div>
          <div class="meta">
            <strong id="running-project">—</strong>
            <span id="running-task-wrap" class="hidden"> · <span id="running-task"></span></span>
          </div>
        </div>
        <div class="row running-actions">
          <button type="button" class="btn btn-secondary" id="pause-btn">Pause</button>
          <button type="button" class="btn btn-primary hidden" id="resume-btn">Resume</button>
          <button type="button" class="btn btn-danger" id="stop-btn">Stop</button>
        </div>
      </div>

      <div id="idle-view" class="hidden">
        <div class="card">
          <div class="field">
            <label for="client-select">Client (optional filter)</label>
            <select id="client-select" data-searchable-select="client" data-can-create="1" data-search-placeholder="Type to search clients…"></select>
            <p class="hint">Filters projects. Type to create a new client.</p>
          </div>
          <div class="field">
            <label for="project-select">Project</label>
            <select id="project-select" data-searchable-select="project" data-can-create="1" data-search-placeholder="Type to search projects…"></select>
            <p class="hint">Required to start a timer. Type to create.</p>
          </div>
          <div class="field">
            <label for="task-select">Task (optional)</label>
            <select id="task-select" data-searchable-select="task" data-can-create="1" data-search-placeholder="Type to search tasks…">
              <option value="">— No task —</option>
            </select>
          </div>
          <div class="field">
            <label for="notes">Notes (optional)</label>
            <input type="text" id="notes" placeholder="What are you working on?" maxlength="500" />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="start-btn">Start timer</button>
        </div>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
