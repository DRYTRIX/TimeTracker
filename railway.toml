# Railway config-as-code for TimeTracker
# https://docs.railway.app/reference/config-as-code
#
# One-click: publish a Railway template (app image + Postgres), then add the
# Deploy button — see docs/deploy/RAILWAY.md
#
# Manual:
#   1. Create a Railway project at https://railway.app
#   2. Add a PostgreSQL plugin
#   3. Add a Docker image service: ghcr.io/drytrix/timetracker:latest
#   4. Set SECRET_KEY, DATABASE_URL (from Postgres), FLASK_ENV=production,
#      AUTH_METHOD=local, REDIS_ENABLED=false
#   5. Deploy

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Prefer deploying the prebuilt image (no build): set the service image in the
# dashboard or template to ghcr.io/drytrix/timetracker:latest

[deploy]
healthcheckPath = "/_ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
