name: Build Mobile Apps

# Store builds ship from cd-release.yml. This workflow is manual (path CI via ci.yml).

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate app icons
        run: |
          pip install Pillow
          python scripts/generate-mobile-icon.py
      - name: Generate launcher icons
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Decode and configure Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/release-key.jks
          {
            echo "storeFile=../release-key.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > mobile/android/key.properties

      - name: Build APK
        working-directory: mobile
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TOKEN: ${{ secrets.OTEL_EXPORTER_OTLP_TOKEN }}
        run: |
          flutter build apk --release \
            --dart-define=OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT:-}" \
            --dart-define=OTEL_EXPORTER_OTLP_TOKEN="${OTEL_EXPORTER_OTLP_TOKEN:-}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate iOS platform files
        working-directory: mobile
        run: flutter create --platforms=ios .

      - name: Generate app icons
        run: |
          pip install Pillow
          python scripts/generate-mobile-icon.py
      - name: Generate launcher icons
        working-directory: mobile
        run: |
          dart run flutter_launcher_icons
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Install CocoaPods deps
        working-directory: mobile
        run: |
          rm -f ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          flutter pub get
          (cd ios && pod install --repo-update)

      - name: Build iOS (simulator)
        working-directory: mobile
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TOKEN: ${{ secrets.OTEL_EXPORTER_OTLP_TOKEN }}
        run: |
          flutter build ios --simulator \
            --dart-define=OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT:-}" \
            --dart-define=OTEL_EXPORTER_OTLP_TOKEN="${OTEL_EXPORTER_OTLP_TOKEN:-}"

      - name: Create iOS archive
        if: success()
        working-directory: mobile
        run: |
          mkdir -p dist
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            cd build/ios/iphonesimulator
            zip -r ../../../dist/TimeTracker-iOS.zip Runner.app
            cd ../../..
          else
            echo "Warning: Runner.app not found"
            ls -la build/ios/ || true
          fi

      - name: Upload iOS build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: mobile/dist/*.zip
          if-no-files-found: warn
