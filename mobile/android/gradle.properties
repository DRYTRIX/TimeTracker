org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# AGP 8+ defaults to R8 full mode, which strips Gson generic signatures used by
# flutter_local_notifications (TypeToken). Keep rules are also in proguard-rules.pro;
# disable full mode as belt-and-braces until the plugin is upgraded to v19+.
android.enableR8.fullMode=false
